<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Logo-opties 2 | Kievits Webdesign</title>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Schibsted+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #161110; --card: #1f1816; --line: rgba(241,232,220,.12); --chalk: #f3ece3; --dim: #b3a79c; --mustard: #e3b448; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--chalk); font-family: "Schibsted Grotesk", system-ui, sans-serif; padding: 40px 18px 60px; }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-family: "Young Serif", serif; font-weight: 400; font-size: 38px; margin-bottom: 8px; }
  .intro { color: var(--dim); margin-bottom: 30px; max-width: 62ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .opt { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: grid; gap: 16px; }
  .opt h2 { font-family: "Young Serif", serif; font-weight: 400; font-size: 22px; display: flex; align-items: center; gap: 10px; }
  .opt h2 span { font-family: "Schibsted Grotesk"; font-size: 12px; font-weight: 700; background: var(--mustard); color: #1e2b24; min-width: 26px; height: 26px; border-radius: 13px; display: grid; place-items: center; padding: 0 6px; }
  .big { height: 140px; display: grid; place-items: center; border-radius: 12px; background: radial-gradient(circle at 50% 40%, rgba(122,40,51,.25), transparent 70%); }
  .big svg { width: 92px; height: 92px; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 12px; background: #120e0d; border: 1px solid var(--line); font-family: "Young Serif", serif; font-size: 20px; }
  .bar svg { width: 30px; height: 30px; flex: none; }
  .row { display: flex; gap: 12px; align-items: center; }
  .tiny { display: flex; gap: 8px; }
  .tiny div { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; }
  .tiny svg { width: 28px; height: 28px; }
  .row small { color: var(--dim); font-size: 13px; line-height: 1.45; }
</style>
</head>
<body>
<main>
  <h1>Logo-opties, ronde 2</h1>
  <p class="intro">Geen letters, dus geen dubbele K naast de naam. Eerst drie versies van de menukaart, daarna nieuwe ideeën die website en horeca combineren. Rechtsonder steeds klein op licht en donker, zoals in een tabblad.</p>
  <div class="grid" id="grid"></div>
</main>

<template id="icons">
  <!-- M1: menu card, as before -->
  <svg data-id="M1" data-name="Menukaart met vinkje" data-text="De vorige, iets verfijnd: een kaartje met een gouden vinkje. Menu klaar, site klaar." viewBox="0 0 48 48"><rect x="1" y="1" width="46" height="46" rx="13" fill="#2a1d16"/><rect x="14" y="9" width="20" height="30" rx="2.5" fill="#f3ece3"/><path d="M18 16h12M18 21h8M18 26h12M18 31h6" stroke="#7a2833" stroke-width="2" stroke-linecap="round"/><circle cx="34" cy="35" r="6.2" fill="#e3b448" stroke="#2a1d16" stroke-width="1.6"/><path d="M31.4 35l1.8 1.8 3.4-3.6" fill="none" stroke="#1e2b24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <!-- M2: open folded menu -->
  <svg data-id="M2" data-name="Open menukaart" data-text="Een opengeslagen kaart, net als de animatie op de site. Twee pagina's, één met de gerechten." viewBox="0 0 48 48"><rect x="1" y="1" width="46" height="46" rx="13" fill="#e3b448"/><path d="M24 13c-3.4-2-8-2.6-12-2v25c4-.6 8.6 0 12 2 3.4-2 8-2.6 12-2V11c-4-.6-8.6 0-12 2z" fill="#2a1d16"/><path d="M24 13v25" stroke="#e3b448" stroke-width="1.6"/><path d="M15.5 18h5M15.5 22h5M15.5 26h3.5M27.5 18h5M27.5 22h5M27.5 26h3.5" stroke="#f3ece3" stroke-width="1.6" stroke-linecap="round"/></svg>
  <!-- M3: menu card with bookmark ribbon -->
  <svg data-id="M3" data-name="Kaart met lintje" data-text="Een staande kaart met een gouden boekenleggerlintje. Chique, rustig, werkt goed klein." viewBox="0 0 48 48"><rect x="1" y="1" width="46" height="46" rx="13" fill="#2a1d16"/><rect x="13" y="8" width="22" height="32" rx="3" fill="#f3ece3"/><path d="M28 8v13l-3-2.4-3 2.4V8z" fill="#e3b448"/><path d="M17 27h14M17 31.5h10" stroke="#7a2833" stroke-width="2" stroke-linecap="round"/></svg>
  <!-- N1: browser window as menu -->
  <svg data-id="N1" data-name="Browser-menu" data-text="Een browservenster met drie stipjes en daarin de regels van een menukaart. Website + horeca in één." viewBox="0 0 48 48"><rect x="1" y="1" width="46" height="46" rx="13" fill="#2a1d16"/><rect x="9" y="11" width="30" height="26" rx="4" fill="#f3ece3"/><path d="M9 15a4 4 0 0 1 4-4h22a4 4 0 0 1 4 4v3H9z" fill="#e3b448"/><circle cx="13.5" cy="14.5" r="1.3" fill="#2a1d16"/><circle cx="17.5" cy="14.5" r="1.3" fill="#2a1d16"/><path d="M14 24h12M14 28.5h8M14 33h10" stroke="#7a2833" stroke-width="2" stroke-linecap="round"/><path d="M29 24h5M29 28.5h5M29 33h5" stroke="#b3a79c" stroke-width="2" stroke-linecap="round"/></svg>
  <!-- N2: fork + cursor -->
  <svg data-id="N2" data-name="Vork en cursor" data-text="Een vork waarvan de steel een muispijltje wordt. Speels, en meteen duidelijk: websites voor horeca." viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="#e3b448"/><path d="M18 9v8a4 4 0 0 0 8 0V9M22 9v8" fill="none" stroke="#2a1d16" stroke-width="2.4" stroke-linecap="round"/><path d="M22 21v6" stroke="#2a1d16" stroke-width="2.6" stroke-linecap="round"/><path d="M22 26l11 7.6-5.2.8 3 5.6-2.6 1.4-3-5.6-3.4 3.8z" fill="#2a1d16" stroke="#2a1d16" stroke-width="1" stroke-linejoin="round"/></svg>
  <!-- N3: plate + cursor -->
  <svg data-id="N3" data-name="Bord met klik" data-text="Een bord van bovenaf, met in het midden een klik-pijltje. Strak en modern, ook mooi als los teken." viewBox="0 0 48 48"><rect x="1" y="1" width="46" height="46" rx="13" fill="#2a1d16"/><circle cx="24" cy="24" r="15" fill="#f3ece3"/><circle cx="24" cy="24" r="10.5" fill="none" stroke="#e3b448" stroke-width="1.6"/><path d="M21 18.5l9.5 6.5-4.4.7 2.5 4.7-2.2 1.2-2.5-4.7-2.9 3.2z" fill="#2a1d16" stroke="#2a1d16" stroke-width=".8" stroke-linejoin="round"/></svg>
  <!-- N4: cloche on screen -->
  <svg data-id="N4" data-name="Geserveerd op scherm" data-text="Een serveerklok op een telefoonscherm: je nieuwe site, geserveerd. Warm wijnrood met goud." viewBox="0 0 48 48"><rect x="1" y="1" width="46" height="46" rx="13" fill="#7a2833"/><rect x="15" y="7" width="18" height="34" rx="4.5" fill="#f3ece3"/><path d="M18 30h12M19.5 30a4.5 4.5 0 0 1 9 0" fill="none" stroke="#7a2833" stroke-width="2" stroke-linecap="round"/><circle cx="24" cy="24.3" r="1.2" fill="#e3b448"/><rect x="21.5" y="10" width="5" height="1.6" rx=".8" fill="#7a2833"/></svg>
  <!-- N5: wine glass + wave (keeps the old wave) -->
  <svg data-id="N5" data-name="Glas met golf" data-text="Het golfje van het huidige logo, maar nu als wijn in een glas. Houdt de herkenning, maar meer horeca." viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="#2a1d16"/><path d="M16 9h16l-1 9a7 7 0 0 1-14 0z" fill="none" stroke="#f3ece3" stroke-width="2.2" stroke-linejoin="round"/><path d="M17 15.5c2.3-1.8 4.6-1.8 7 0s4.7 1.8 7 0l-.4 2.8a6.6 6.6 0 0 1-13.2 0z" fill="#e3b448"/><path d="M24 25v10M18.5 37h11" stroke="#f3ece3" stroke-width="2.2" stroke-linecap="round"/></svg>
</template>

<script>
  const grid = document.getElementById('grid');
  document.getElementById('icons').content.querySelectorAll('svg').forEach(s => {
    const html = s.outerHTML;
    const plain = html.replace(/<rect x="1" y="1" width="46" height="46" rx="13"[^>]*\/>|<circle cx="24" cy="24" r="23"[^>]*\/>/, '');
    const sec = document.createElement('section'); sec.className = 'opt';
    sec.innerHTML = `<h2><span>${s.dataset.id}</span>${s.dataset.name}</h2>
      <div class="big">${html}</div>
      <div class="bar">${html}Kievits Webdesign</div>
      <div class="row"><div class="tiny"><div style="background:#f3ece3">${html}</div><div style="background:#000">${html}</div></div><small>${s.dataset.text}</small></div>`;
    grid.append(sec);
  });
</script>
</body>
</html>
